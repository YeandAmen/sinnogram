name: Check Sinnogram
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check web/app.js
      - run: node --check web/scene.js
      - run: node --check web/location.js
      - run: node --check web/places.js
      - run: node --check web/place-review.js
      - run: node --test tests/*.test.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check_fct_coverage.py
